<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R-0230 伝票編集 実寸見本 v2（D案）</title>
  <link rel="stylesheet" href="../../frontend/src/styles/beaver-ui.css">
  <link rel="stylesheet" href="../../frontend/src/styles/voucherEdit.css">
  <style>
    body{margin:0;background:#cbd5e1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mock-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:4px;min-height:32px;padding:4px 10px;border-bottom:1px solid #94a3b8;background:#e2e8f0;font-size:12px}.mock-bar button{padding:3px 8px;border:1px solid #94a3b8;background:#fff}.mock-bar button.on{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.mock-bar select{height:24px;border:1px solid #94a3b8;background:#fff}.mock-note{margin-left:auto;color:#475569}.mock-viewport{margin:0 auto;background:#fff;min-height:calc(100vh - 33px);box-shadow:0 0 0 1px #94a3b8}.mock-viewport.w1280{width:1280px}.mock-viewport.w1440{width:1440px}.mock-viewport.w1920{width:1920px}.mock-viewport .ve-topbar{top:33px}.mock-viewport .ve-summary-side{top:82px;max-height:calc(100vh - 92px)}
  </style>
</head>
<body>
<div class="mock-bar">
  <b>画面幅</b><button data-width="1280">1280px</button><button class="on" data-width="1440">1440px</button><button data-width="1920">1920px</button>
  <b>状態</b><select id="state"><option value="edit4">編集可能な見積・4行・選択あり</option><option value="edit12">明細12行・選択なし</option><option value="new">新規作成・未保存・1行</option><option value="readonly">読み取り専用・Access請求済み</option><option value="saving">保存中</option><option value="error">保存失敗</option><option value="conflict">409競合</option><option value="sales">売上伝票</option></select>
  <span class="mock-note">D案 v2・実寸確認用（幅はブラウザ内に固定）</span>
</div>
<div class="mock-viewport w1440" id="viewport"><div class="bv-ui ve-page" id="app"></div></div>
<script>
const baseLines=[
 {kind:'normal',item:'フラッシュ戸（ポリ合板・白）',place:'1階 事務室入口',qty:2,memo:'丁番・レバーハンドル取付、既存枠調整',price:[90000,15000,10000],cost:[45000,8000,7000],factory:4,site:1.5,rate:3500},
 {kind:'normal',item:'木製ガラス引戸（タモ突板）',place:'2階 応接室',qty:1,memo:'透明強化ガラス5mm、戸車・引手込み',price:[110000,20000,30000],cost:[70000,12000,18000],factory:6,site:2,rate:3500},
 {kind:'discount',item:'現場調整値引',place:'',qty:1,memo:'一式',total:-20000},
 {kind:'subtotal',item:'建具工事 小計',place:'',qty:1,memo:'',total:370000}
];
const extra=[
 ['木製片開き戸（シナ合板）','1階 倉庫',1,72000,31000,7000,3000,3,1],['アルミ框ガラス戸','1階 風除室',1,185000,88000,24000,22000,5,3],['障子（荒間・ワーロン）','2階 和室',4,46000,18000,2500,3500,2.5,.5],['襖（新鳥の子）','2階 和室',4,39000,13000,3500,0,2,.5],['木製引違い戸','会議室',2,98000,43000,9000,8000,4,1],['収納折戸','更衣室',2,84000,36000,15000,2000,3,1.5],['欄間ガラリ','機械室',3,32000,12000,2500,0,1.5,.5],['点検口扉','廊下 天井裏',2,41000,16000,4500,0,2,1]
].map(x=>({kind:'normal',item:x[0],place:x[1],qty:x[2],memo:'製作・運搬・取付込み',price:[x[3],0,0],cost:[x[4],x[5],x[6]],factory:x[7],site:x[8],rate:3500}));
const states={edit4:{lines:baseLines,selected:0},edit12:{lines:[baseLines[0],baseLines[1],...extra,baseLines[2],baseLines[3]],selected:null},new:{lines:[{kind:'normal',item:'木製片開き戸',place:'1階 給湯室',qty:1,memo:'採寸後に詳細確定',price:[68000,12000,0],cost:[30000,7000,0],factory:3,site:1,rate:3500}],selected:0,new:true},readonly:{lines:baseLines,selected:null,readonly:true,notice:'Accessで請求済み（請求日 2026/10/28）のため編集できません'},saving:{lines:baseLines,selected:0,save:'saving'},error:{lines:baseLines,selected:0,save:'error',notice:'保存に失敗しました。通信状態を確認して再試行してください。'},conflict:{lines:baseLines,selected:0,save:'conflict',notice:'ほかで更新されています（409競合）。再読み込みすると未保存の入力は失われます。'},sales:{lines:baseLines,selected:0,sales:true,notice:'この売上は見積 E04128 から引用されました（引用日: 2026/11/01）'}};
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP'); const num=n=>Number(n).toLocaleString('ja-JP');
const lineSellTotal=l=>Math.floor(Number(((l.price||[]).reduce((a,b)=>a+b,0)*l.qty).toFixed(6)));
function totals(lines){let sales=0,discount=0,body=0,hardware=0,glass=0,labor=0,factory=0,site=0;lines.forEach(l=>{if(l.kind==='normal'){const q=l.qty;sales+=lineSellTotal(l);body+=l.cost[0]*q;hardware+=l.cost[1]*q;glass+=l.cost[2]*q;factory+=l.factory*q;site+=l.site*q;labor+=(l.factory+l.site)*l.rate*q}else if(l.kind==='discount')discount+=Math.abs(l.total)});const taxable=sales-discount,tax=Math.floor(taxable*.1),cost=body+hardware+glass+labor,profit=taxable-cost,gross=taxable-(body+hardware+glass);return{sales,discount,taxable,tax,total:taxable+tax,body,hardware,glass,labor,cost,profit,factory,site,hours:factory+site,rate:taxable?profit/taxable:0,gross,daily:(factory+site)>8?gross/((factory+site)/8):gross}}
function metric(label,value,cls=''){return `<div class="ve-metric"><div class="ve-metric-label">${label}</div><div class="ve-metric-value bv-number ${cls}">${value}</div></div>`}
function summary(t,side=false){return `<section class="bv-panel ve-summary ${side?'ve-summary-side':'ve-main-summary'}"><div class="bv-panel-title"><h2>詳細サマリー</h2><span class="bv-panel-note">売上は税込合計／利益は税抜売上基準</span></div><div class="ve-summary-body"><div class="ve-metric-group">${metric('売上（税込）',yen(t.total))}${metric('製造原価',yen(t.cost))}${metric('利益',yen(t.profit))}</div><div class="ve-metric-group">${metric('工場時間',num(t.factory)+' h')}${metric('現場時間',num(t.site)+' h')}${metric('合計時間',num(t.hours)+' h')}</div><div class="ve-summary-detail"><div class="ve-detail-row ve-rate"><span>利益率</span><span class="bv-number">${(t.rate*100).toFixed(1)}%</span></div><div class="ve-detail-row"><span>本体</span><span class="bv-amount">${yen(t.body)}</span></div><div class="ve-detail-row"><span>金物</span><span class="bv-amount">${yen(t.hardware)}</span></div><div class="ve-detail-row"><span>ガラス</span><span class="bv-amount">${yen(t.glass)}</span></div><div class="ve-detail-row"><span>労務</span><span class="bv-amount">${yen(t.labor)}</span></div></div></div></section>`}
function cell(label,value,type='text'){return `<label class="bv-cell"><span class="bv-label">${label}</span><input class="bv-control" type="${type}" value="${value}"></label>`}
function header(s){return `<section class="bv-panel"><div class="bv-panel-title"><h2>伝票ヘッダー</h2></div><div class="ve-header-grid">${cell('得意先 *','みどり野施設管理株式会社')}${cell('案件','みどり野交流センター 建具改修')}${cell(s.sales?'売上日 *':'見積日 *','2026-11-02','date')}${cell('ステータス',s.new?'下書き':'提出済')}${cell('伝票種別',s.sales?'売上':'見積')}</div><div class="ve-header-grid ve-header-grid-secondary ${s.sales?'ve-header-grid-sales':''}">${cell('摘要','交流センター1・2階 木製建具改修工事')}${cell('売上種別','1 地元建具')}${cell('納期','2026-11-25','date')}${cell('納品日','','date')}${s.sales?'':cell('有効期限','見積後30日間')}<div class="bv-cell"><span class="bv-label">売価金額の入力方式</span><div class="bv-toggle-list"><button class="bv-toggle bv-toggle-active">税抜入力</button><button class="bv-toggle">税込入力</button></div></div></div><label class="bv-cell ve-header-textarea"><span class="bv-label">説明</span><textarea class="bv-control" rows="2">木製建具の製作・運搬・取付一式。既存枠の調整を含みます。</textarea></label><label class="bv-cell ve-header-textarea"><span class="bv-label">非表示記録 <small>帳票に出ない</small></span><textarea class="bv-control" rows="2">現地採寸済み。応接室は施設休館日に施工する。</textarea></label></section>`}
const input=(value,cls='')=>`<input class="bv-control ${cls}" value="${value}">`;
function normalLine(l,i,t,selected){const sell=lineSellTotal(l),mat=l.cost.reduce((a,b)=>a+b,0)*l.qty,lab=(l.factory+l.site)*l.rate*l.qty,cost=mat+lab;return `<div class="ve-line ${selected?'ve-line-selected':''}"><div class="ve-line-no">${i+1}</div><div class="ve-line-main"><label><span>取付場所</span>${input(l.place)}</label><label><span>品名</span>${input(l.item)}</label><label><span>数量</span>${input(l.qty,'bv-number')}</label><label><span>備考</span>${input(l.memo)}</label></div><div class="ve-bands"><div class="ve-band ve-band-cost"><span>原価</span>${input(l.cost[0],'bv-amount')}${input(l.cost[1],'bv-amount')}${input(l.cost[2],'bv-amount')}<span></span>${input(l.factory,'bv-number')}${input(l.site,'bv-number')}${input(l.rate,'bv-amount')}<span class="bv-amount">${yen(cost)}</span><span></span></div><div class="ve-band ve-band-price"><span>売値</span>${input(l.price[0],'bv-amount')}${input(l.price[1],'bv-amount')}${input(l.price[2],'bv-amount')}<span>課税</span><span></span><span></span><span></span><span class="bv-amount">${yen(sell)}</span><span></span></div><div class="ve-band ve-band-profit"><span>結果</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span class="bv-amount">${yen(sell-cost)}</span><span>利益率 ${sell?((sell-cost)/sell*100).toFixed(1):'—'}%</span></div></div></div>`}
function specialLine(l,i,t){const shown=l.kind==='subtotal'?t.taxable:l.total;return `<div class="ve-line ve-line-${l.kind}"><div class="ve-line-no">${i+1}</div><div class="ve-line-main"><label><span>取付場所</span>${input(l.place)}</label><label><span>品名</span>${input(l.item)}</label><label><span>数量</span>${input(l.qty,'bv-number')}</label><label><span>備考</span>${input(l.memo)}</label></div><div class="ve-bands"><div class="ve-band ${l.kind==='discount'?'ve-band-price':'ve-band-profit'}"><span>${l.kind==='discount'?'値引':'小計'}</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span class="bv-amount">${yen(shown)}</span><span></span></div></div></div>`}
function lines(s,t){return `<div class="ve-profit-rate"><span class="bv-label">利益率の早押し（対象: ${s.selected==null?'全行':'選択行 No.'+(s.selected+1)}）</span><div class="bv-toggle-list"><button class="bv-toggle">20%</button><button class="bv-toggle bv-toggle-active">30%</button><button class="bv-toggle">35%</button><button class="bv-toggle">40%</button></div></div><div class="ve-row-actions"><button class="bv-btn">製品複製</button><button class="bv-btn">行を挿入</button><button class="bv-btn bv-btn-danger">行を削除</button><button class="bv-btn">▲</button><button class="bv-btn">▼</button><span class="bv-panel-note">${s.selected==null?'行を選択してください':'No.'+(s.selected+1)+' を選択中'}</span></div><section class="bv-panel ve-lines-panel"><div class="bv-panel-title"><h2>明細</h2><span class="bv-panel-note">固定幅 1,283px・この枠内だけ横スクロール</span></div><div class="ve-lines-scroll"><div class="ve-lines"><div class="ve-line-heading"><span>No</span><span>1段目: 取付場所・品名／2段目: 数量・備考</span><span>原価・作業（橙）→売値（緑）　　本体　　金物　　ガラス　　税区分　　工場h　　現場h　　労務単価　　合計　　利益</span></div>${s.lines.map((l,i)=>l.kind==='normal'?normalLine(l,i,t,s.selected===i):specialLine(l,i,t)).join('')}</div></div><div class="ve-lines-footer"><button class="bv-btn bv-add-row">＋ 行を追加</button><span class="bv-panel-note">${s.lines.length} 行</span></div></section>`}
function render(){const s=states[document.getElementById('state').value],t=totals(s.lines),app=document.getElementById('app');app.className='bv-ui ve-page '+(s.readonly?'ve-state-readonly':'');let notice=s.notice?`<div class="ve-notice ${s.save==='error'||s.save==='conflict'||s.readonly?'ve-notice-error':s.sales?'ve-notice-info':''}">${s.notice}${s.save==='error'?' <button class="bv-btn">再試行</button>':''}${s.save==='conflict'?' <button class="bv-btn">再読み込み</button>':''}</div>`:'';app.innerHTML=`<header class="bv-topbar ve-topbar"><div class="ve-topbar-main"><button class="bv-btn">← 戻る</button><strong class="ve-title bv-mono">${s.new?'伝票 新規作成':s.sales?'売上 S04116':'見積 E04128'}</strong>${s.readonly?'<span class="ve-badge">参照モード</span>':''}${s.new?'':'<span class="ve-badge ve-badge-access">Access由来</span><span class="ve-meta">Access№ 4128　最終同期: 2026-11-02 09:12　最終更新: 09:18</span>'}</div><div class="ve-topbar-actions"><span class="${s.save==='saving'?'bv-save-saving':s.save==='error'||s.save==='conflict'?'bv-save-error':'bv-save-saved'}">${s.new?'未保存':s.save==='saving'?'保存中…':s.save==='error'?'保存失敗':s.save==='conflict'?'競合':'保存済 09:18'}</span>${!s.sales&&!s.new?'<button class="bv-btn">引用して売上</button>':''}${!s.new?'<button class="bv-btn">原価再取得</button>':''}<button class="bv-btn">AI宛にコピー</button><button class="bv-btn">プレビュー</button><button class="bv-btn">閉じる</button></div></header>${notice}<div class="ve-shell"><main class="ve-main">${header(s)}${summary(t)}${lines(s,t)}<div class="ve-bottom"><div class="ve-tax-detail"><div class="ve-detail-row"><span>課税対象額（税抜）</span><span class="bv-amount">${yen(t.taxable)}</span></div><div class="ve-detail-row"><span>消費税（10%）</span><span class="bv-amount">${yen(t.tax)}</span></div><div class="ve-detail-row"><span>粗利率</span><span class="bv-number">${t.taxable?(t.gross/t.taxable*100).toFixed(1):'—'}%</span></div><div class="ve-detail-row"><span>日割り粗利</span><span class="bv-amount">${yen(t.daily)}/日</span></div></div><div>${s.readonly?'<button class="bv-btn">← 案件に戻る</button>':s.new?'<button class="bv-btn">キャンセル</button> <button class="bv-btn bv-btn-primary">保存</button>':'<button class="bv-btn bv-btn-danger">伝票を取消</button>'}</div></div></main>${summary(t,true)}</div>${s.save?`<div class="ve-save-float ${s.save==='saving'?'bv-save-saving':'bv-save-error'}">${s.save==='saving'?'保存中…':s.save==='error'?'保存に失敗しました':'ほかで更新されています'}</div>`:''}`;}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-width]').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('viewport').className='mock-viewport w'+b.dataset.width});document.getElementById('state').onchange=render;if(innerWidth>1750)document.querySelector('[data-width="1920"]').click();else if(innerWidth<1400)document.querySelector('[data-width="1280"]').click();render();
</script>
</body></html>
